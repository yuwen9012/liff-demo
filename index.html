<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>回報表單（模擬）</title>
<!--
  LIFF 模擬頁（假資料，不連預約系統）
  上傳到 GitHub Pages 時改名為 index.html。
  圖文選單連結：
    業績回報 https://liff.line.me/{LIFF ID}?form=rep
    客情反饋 https://liff.line.me/{LIFF ID}?form=fb
-->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --bg:#f6f4ef; --panel:#fffdf8; --ink:#2b211a; --sub:#7a6c5d; --line:#e4d7bd;
  --gold:#b8892f; --gold-soft:#fbf3e2; --brown:#4a3e2e; --ok:#2f8f5b; --warn:#c0392b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
body{min-height:100vh;display:flex;flex-direction:column}
main{flex:1;padding:14px 14px 24px;max-width:560px;width:100%;margin:0 auto}
footer.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
footer.bar:empty{display:none}
footer.bar>div{max-width:560px;margin:0 auto}

.hello{font-size:13px;color:var(--sub);margin-bottom:8px}
.topline{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.topline b{font-size:18px}
.topline span{font-size:13px;color:var(--warn)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.sec h3{margin:0 0 6px;font-size:14px;color:var(--sub);font-weight:500;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed #efe6d4}
.row:last-child{border-bottom:0}
.row label{flex:1;font-weight:700}
.row .in{display:flex;align-items:center;gap:6px}
.row input{width:130px;text-align:right;font:inherit;font-size:17px;padding:8px 10px;border:1px solid #d6cbb8;border-radius:10px;background:#fff;color:var(--ink)}
.row input:focus{outline:2px solid var(--gold);border-color:transparent}
.row .u{color:var(--sub);font-size:14px;min-width:18px}
.hint{font-size:13px;color:var(--sub)}
.hint.warn{color:var(--warn)}
.req{color:var(--warn)}
.banner{border-radius:12px;padding:9px 12px;font-size:14px;margin-bottom:12px}
.banner.info{background:var(--gold-soft);border:1px solid var(--line)}
.banner.alert{background:#fdeeee;border:1px solid #e3a3a3;color:#8a1f1f}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.total b{font-size:22px;color:var(--gold)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.btn.pri{background:var(--brown);color:#fff}
.btn.pri:disabled{background:#cbbfae}
.btn.sec2{background:#fff;color:var(--brown);border:1px solid #cfc0a5;margin-top:8px}

.seg{display:flex;background:#ece5d6;border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px 0;border-radius:10px;font:inherit;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg button small{display:block;font-size:12px;line-height:1.1}
.search{width:100%;font:inherit;padding:10px 12px;border:1px solid #d6cbb8;border-radius:10px;margin-bottom:8px;background:#fff;color:var(--ink)}
.cust{display:flex;align-items:center;gap:10px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.cust:active{border-color:var(--gold)}
.cust .n{font-weight:700}
.cust .m{font-size:13px;color:var(--sub)}
.cust .tag{margin-left:auto;font-size:12px;padding:2px 8px;border-radius:99px;background:#e8f6ee;color:var(--ok);white-space:nowrap}
.cust .tag.no{background:#f1ece2;color:var(--sub)}
.cust .arr{color:#bbb}
.who{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.who b{font-size:17px}
.who a{float:right;color:var(--gold);font-size:14px}
.back{display:inline-block;color:var(--gold);font-size:14px;margin-bottom:8px}
.prev{font-size:14px;border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:6px 0;color:#4f4338}
.prev .s{color:var(--sub);font-size:12px}
textarea{width:100%;min-height:180px;font:inherit;padding:10px 12px;border:1px solid #d6cbb8;border-radius:12px;resize:vertical;background:#fff;color:var(--ink)}
.count{text-align:right;font-size:12px;color:var(--sub)}
.count.over{color:var(--warn)}
.empty{text-align:center;color:var(--sub);padding:30px 0;font-size:14px}

.done{text-align:center;padding:24px 4px}
.done .big{font-size:46px}
.done h2{margin:6px 0 2px;font-size:21px}
.done p{margin:0;color:var(--sub);font-size:14px}
.sum{background:#fbf6ee;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:16px 0;text-align:left;font-size:15px;white-space:pre-wrap}
.sum .r{display:flex;justify-content:space-between;padding:2px 0}
.sum .r.ind{padding-left:12px;color:var(--sub)}
.sum hr{border:0;border-top:1px solid var(--line);margin:8px 0}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:20}
.mask.show{display:flex}
.sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h4{margin:0 0 6px;font-size:17px}
.sheet p{margin:0 0 12px;font-size:15px;color:#4f4338;white-space:pre-line}

.menu .btn{margin-bottom:10px}
.demo{margin:18px auto 0;max-width:560px;font-size:13px;color:var(--sub)}
.demo summary{cursor:pointer}
.demo label{display:flex;gap:8px;align-items:center;margin:8px 0}
</style>
</head>
<body>
<main id="main"></main>
<footer class="bar" id="foot"></footer>

<div class="mask" id="mask"><div class="sheet">
  <h4 id="m-t"></h4><p id="m-p"></p>
  <button class="btn pri" id="m-ok">確定</button>
  <button class="btn sec2" onclick="hideMask()">返回修改</button>
</div></div>

<script>
/* ========== 設定：建好 LIFF 後把 LIFF ID 填在這裡 ========== */
const LIFF_ID = '2012761142-3REcOMxJ';
/* ======================================================= */

const CATS=[['rehab','復能'],['eecp','EECP'],['drip','營養點滴'],['exam','體檢商品'],['supp','保健食品']];
const RECV_SYS=6;
const DAYS=[{k:0,l:'今天',d:'11/3（二）'},{k:1,l:'昨天',d:'11/2（一）'},{k:2,l:'前天',d:'11/1（日）'}];
const CUSTS={
  0:[{n:'王志明',m:'00000231',c:'EECP、靜脈營養點滴',segs:[{t:'10:12',x:'今天做完 EECP 後說胸悶改善很多，想了解下一期的方案。'},{t:'14:40',x:'下午點滴時太太陪同，詢問保健食品的價格。'}]},
      {n:'李美華',m:'00000877',c:'ILIB',segs:[]},
      {n:'吳佩玲',m:'00001402',c:'靜脈營養點滴',segs:[]},
      {n:'鄭雅雯',m:'00002088',c:'EECP',segs:[]},
      {n:'蔡宗宏',m:'00000556',c:'ILIB',segs:[{t:'16:05',x:'對全方位抗衰體檢有興趣，下週帶報告來討論。'}]}],
  1:[{n:'陳建宏',m:'00003310',c:'INDIBA',segs:[]},{n:'黃美玲',m:'00004021',c:'EECP',segs:[]}],
  2:[]
};
let me='林雅婷', inLine=false, form='';
let late=false, doneBefore=false, prevRep=null, rep={};
let fb={step:'list',day:0,q:'',cust:null,text:''};

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(n||0).toLocaleString('en-US');
const num=v=>{v=String(v??'').replace(/[,\s]/g,'');if(v==='')return null;const x=Number(v);return Number.isFinite(x)&&x>=0?Math.round(x):NaN};

/* ---------- 啟動 ---------- */
function readForm(){
  const p=new URLSearchParams(location.search);
  if(p.get('form'))return p.get('form');
  const st=p.get('liff.state');               // LIFF 第一次轉址時，參數放在 liff.state
  if(st){const q=new URLSearchParams(st.split('?')[1]||'');return q.get('form')||'';}
  return '';
}
async function boot(){
  if(LIFF_ID&&window.liff){
    try{
      await liff.init({liffId:LIFF_ID});
      inLine=liff.isInClient();
      if(liff.isLoggedIn()){const p=await liff.getProfile();me=p.displayName||me;}
    }catch(e){console.warn('LIFF 初始化失敗，以一般網頁模式顯示',e);}
  }
  form=readForm();
  document.title=form==='rep'?'業績回報':form==='fb'?'客情反饋':'回報表單（模擬）';
  go(form);
}
function go(f){
  form=f;
  if(f==='rep'){initRep();}
  else if(f==='fb'){fb={step:'list',day:0,q:'',cust:null,text:''};renderFb();}
  else renderMenu();
}
function closeForm(){
  if(inLine){liff.closeWindow();return;}
  go('');                                      // 不在 LINE 裡時回到首頁
}
function hello(){return `<div class="hello">${esc(me)} 您好${inLine?'':'（瀏覽器預覽）'}</div>`}

function renderMenu(){
  $('main').innerHTML=`${hello()}<h2 style="margin:4px 0 14px">回報表單（模擬）</h2>
   <div class="menu"><button class="btn pri" onclick="go('rep')">業績回報</button><button class="btn sec2" onclick="go('fb')">客情反饋</button></div>
   ${demoPanel()}`;
  $('foot').innerHTML='';
}
function demoPanel(){
  return `<details class="demo"><summary>情境模擬（展示用）</summary>
    <label><input type="checkbox" ${late?'checked':''} onchange="late=this.checked;go(form)"> 模擬 21:00 之後</label>
    <label><input type="checkbox" ${doneBefore?'checked':''} onchange="doneBefore=this.checked;if(!doneBefore)prevRep=null;go(form)"> 模擬今天已從系統回報過</label>
    <div>資料皆為假資料，送出不會寫入任何系統。</div></details>`;
}

/* ---------- 業績回報 ---------- */
function initRep(){
  if(doneBefore&&!prevRep) prevRep={vals:{rehab:30000,eecp:null,drip:12000,exam:null,supp:null,contact:8,recv:6},at:'18:42',src:'系統'};
  rep=prevRep?{...prevRep.vals}:{rehab:null,eecp:null,drip:null,exam:null,supp:null,contact:null,recv:RECV_SYS};
  renderRep();
}
function repTotal(){return CATS.reduce((s,[k])=>s+(Number.isFinite(rep[k])?rep[k]:0),0)}
function recvHint(){const d=Number.isFinite(rep.recv)&&Math.abs(rep.recv-RECV_SYS)>=2;
  return {cls:'hint'+(d?' warn':''),txt:`系統算出 ${RECV_SYS} 位，可修改`+(d?'；與系統差 2 位以上，送出前會再確認':'')};}
function renderRep(){
  if(late){
    $('main').innerHTML=`${hello()}<div class="done"><div class="big">🔒</div><h2>今天的回報已於 21:00 截止</h2><p>${prevRep?`今天已於 ${prevRep.at} 回報（來源：${prevRep.src}）`:'今天沒有送出回報，記為「未回報」'}</p></div>${demoPanel()}`;
    $('foot').innerHTML=`<div><button class="btn sec2" style="margin:0" onclick="closeForm()">關閉</button></div>`;return;
  }
  const head=prevRep?`<div class="banner info">今天已於 ${prevRep.at} 回報（來源：${prevRep.src}）。再次送出會覆蓋。</div>`:'';
  const rows=CATS.map(([k,l])=>`<div class="row"><label for="i-${k}">${l}</label><div class="in"><span class="u">NT$</span><input id="i-${k}" inputmode="numeric" placeholder="0" value="${rep[k]??''}" oninput="setRep('${k}',this.value)"></div></div>`).join('');
  const h=recvHint();
  $('main').innerHTML=`${hello()}<div class="topline"><b>11/3（二）業績回報</b><span>21:00 截止</span></div>${head}
  <div class="sec"><h3><span>業績金額</span><span>沒有的類別不用填</span></h3>${rows}</div>
  <div class="sec"><h3><span>客戶數</span></h3>
    <div class="row"><label for="i-contact">聯絡客戶 <span class="req">*</span></label><div class="in"><input id="i-contact" inputmode="numeric" placeholder="必填" value="${rep.contact??''}" oninput="setRep('contact',this.value)"><span class="u">位</span></div></div>
    <div class="row"><label for="i-recv">接待客戶 <span class="req">*</span></label><div class="in"><input id="i-recv" inputmode="numeric" value="${rep.recv??''}" oninput="setRep('recv',this.value)"><span class="u">位</span></div></div>
    <div class="${h.cls}" id="recv-hint">${h.txt}</div>
  </div>${demoPanel()}`;
  renderRepFoot();
}
function renderRepFoot(){
  const ok=Number.isFinite(rep.contact)&&Number.isFinite(rep.recv)&&CATS.every(([k])=>!Number.isNaN(rep[k]));
  $('foot').innerHTML=`<div><div class="total"><span>業績合計</span><b>NT$ ${fmt(repTotal())}</b></div><button class="btn pri" ${ok?'':'disabled'} onclick="submitRep()">送出</button></div>`;
}
function setRep(k,v){rep[k]=num(v);
  if(k==='recv'){const h=recvHint();$('recv-hint').className=h.cls;$('recv-hint').textContent=h.txt;}
  renderRepFoot();}
function submitRep(){
  if(Math.abs(rep.recv-RECV_SYS)>=2){showMask('接待客戶與系統不同',`您填 ${rep.recv} 位，系統算出 ${RECV_SYS} 位。\n確定要送出嗎？`,doSubmitRep);return;}
  doSubmitRep();
}
function doSubmitRep(){
  hideMask();
  prevRep={vals:{...rep},at:new Date().toTimeString().slice(0,5),src:'LINE'};
  const lines=CATS.filter(([k])=>rep[k]).map(([k,l])=>`<div class="r ind"><span>${l}</span><span>${fmt(rep[k])}</span></div>`).join('');
  const note=rep.recv!==RECV_SYS?` <span style="font-size:12px;color:var(--sub)">（系統 ${RECV_SYS} 位）</span>`:'';
  $('main').innerHTML=`<div class="done"><div class="big">🌱</div><h2>今天辛苦了</h2><p>11/3（二）業績回報已完成</p>
   <div class="sum" style="white-space:normal"><div class="r"><span>今日業績</span><b style="color:var(--gold)">NT$ ${fmt(repTotal())}</b></div>${lines}<hr>
   <div class="r"><span>聯絡客戶</span><span>${rep.contact} 位</span></div><div class="r"><span>接待客戶</span><span>${rep.recv} 位${note}</span></div></div>
   <p style="font-size:13px">需要修改的話，21:00 前再點一次「業績回報」就可以囉。</p><div class="hint" id="chat-note"></div></div>`;
  $('foot').innerHTML=`<div><button class="btn pri" onclick="closeForm()">關閉</button></div>`;
  scrollTo(0,0);
  const rows=[flexRow('今日業績',`NT$ ${fmt(repTotal())}`,true),
    ...CATS.filter(([k])=>rep[k]).map(([k,l])=>flexRow('　'+l,fmt(rep[k]))),
    {type:'separator',margin:'md'},
    flexRow('聯絡客戶',`${rep.contact} 位`),
    flexRow('接待客戶',`${rep.recv} 位`+(rep.recv!==RECV_SYS?`（系統 ${RECV_SYS} 位）`:''))];
  postToChat(`11/3（二）業績回報 NT$ ${fmt(repTotal())}`, flexCard('✅ 業績回報已完成','11/3（二）',rows));
}

/* ---------- 送出後傳一張回報卡到聊天室（liff.sendMessages，以使用者名義發送） ---------- */
function flexRow(l,r,strong){
  return {type:'box',layout:'horizontal',margin:'sm',contents:[
    {type:'text',text:l,size:'sm',color:'#555555',flex:0},
    {type:'text',text:r,size:strong?'md':'sm',align:'end',weight:strong?'bold':'regular',color:strong?'#b8892f':'#111111'}]};
}
function flexCard(title,sub,body){
  return {type:'bubble',styles:{body:{backgroundColor:'#fbf6ee'}},body:{type:'box',layout:'vertical',contents:[
    {type:'text',text:title,weight:'bold',size:'md',color:'#2f8f5b'},
    {type:'text',text:sub,size:'sm',color:'#7a6c5d',wrap:true},
    {type:'separator',margin:'md'},...body]}};
}
async function postToChat(altText,bubble){
  const note=$('chat-note');
  if(!inLine){note.textContent='（瀏覽器預覽：在 LINE 開啟時，會同時傳一張回報卡到聊天室）';return;}
  if(!liff.isApiAvailable('sendMessages')){note.textContent='未傳送到聊天室：請從官方帳號的聊天室開啟表單。';return;}
  try{
    await liff.sendMessages([{type:'flex',altText,contents:bubble}]);
    note.textContent='已傳送一張回報卡到聊天室。';
  }catch(e){
    note.textContent='未傳送到聊天室：請確認 LIFF 已勾選 chat_message.write 權限。（'+(e.message||e)+'）';
  }
}

/* ---------- 客情反饋 ---------- */
function renderFb(){
  const day=DAYS[fb.day];
  if(fb.step==='list'){
    $('main').innerHTML=`${hello()}<div class="seg">${DAYS.map(d=>`<button class="${d.k===fb.day?'on':''}" onclick="fb.day=${d.k};fb.q='';renderFb()">${d.l}<small>${d.d}</small></button>`).join('')}</div>
      <input class="search" type="search" placeholder="搜尋姓名或病歷號" value="${esc(fb.q)}" oninput="fb.q=this.value;renderFbList()">
      <div class="hint" style="margin:0 0 8px">我負責的客戶・${day.d} 有到店</div>
      <div id="fb-list"></div>${demoPanel()}`;
    renderFbList();$('foot').innerHTML='';return;
  }
  if(fb.step==='write'){
    const c=fb.cust,n=c.segs.length+1;
    const prev=c.segs.length?`<div class="sec"><h3><span>已回報 ${c.segs.length} 段</span></h3>${c.segs.map((s,i)=>`<div class="prev"><div class="s">第 ${i+1} 段・${s.t}</div>${esc(s.x)}</div>`).join('')}</div>`:'';
    $('main').innerHTML=`<a class="back" onclick="fb.step='list';renderFb()">‹ 客戶清單</a>
      <div class="who"><a onclick="fb.step='list';renderFb()">換客戶</a><b>${c.n}</b>　${c.m}<br>${day.l} ${day.d}・${c.c}</div>${prev}
      <div class="sec"><h3><span>${c.segs.length?`補充第 ${n} 段`:'回報內容'}</span></h3>
      <textarea id="fb-text" placeholder="例如：客戶反應、想了解的方案、家屬意見…" oninput="fb.text=this.value;fbCount()">${esc(fb.text)}</textarea>
      <div class="count" id="fb-count"></div></div>`;
    fbCount();return;
  }
  if(fb.step==='done'){
    const c=fb.cust;
    $('main').innerHTML=`<div class="done"><div class="big">🙏</div><h2>感謝您的回報</h2><p>${c.n}｜${day.l} ${day.d}・第 ${c.segs.length} 段</p>
      <div class="sum">${esc(fb.lastText)}</div><div class="hint" id="chat-note"></div></div>`;
    $('foot').innerHTML=`<div><button class="btn pri" onclick="fb.step='list';fb.text='';fb.q='';renderFb()">回報同日其他客戶</button><button class="btn sec2" onclick="closeForm()">關閉</button></div>`;
    scrollTo(0,0);
  }
}
function renderFbList(){
  const q=fb.q.trim(), all=CUSTS[fb.day];
  const list=all.filter(c=>!q||c.n.includes(q)||c.m.includes(q));
  $('fb-list').innerHTML=list.length?list.map(c=>`<div class="cust" onclick="pickCust(${all.indexOf(c)})"><div><div class="n">${c.n}</div><div class="m">${c.m}・${c.c}</div></div><span class="tag ${c.segs.length?'':'no'}">${c.segs.length?`已回報 ${c.segs.length} 段`:'未回報'}</span><span class="arr">›</span></div>`).join('')
    :`<div class="empty">${q?'找不到符合的客戶':'這一天沒有您負責的到店客戶'}</div>`;
}
function pickCust(i){fb.cust=CUSTS[fb.day][i];fb.step='write';renderFb();scrollTo(0,0);}
function fbCount(){
  const len=fb.text.length,over=len>500,ok=fb.text.trim()&&!over;
  const c=$('fb-count');c.textContent=`${len} / 500`;c.className='count'+(over?' over':'');
  $('foot').innerHTML=`<div><button class="btn pri" ${ok?'':'disabled'} onclick="confirmFb()">送出</button></div>`;
}
function confirmFb(){
  const c=fb.cust,d=DAYS[fb.day];
  showMask('確認送出？',`${c.n}｜${d.l} ${d.d}\n${c.segs.length?`補充第 ${c.segs.length+1} 段`:'新增回報'}`,doSubmitFb);
}
function doSubmitFb(){
  hideMask();
  if(late&&fb.day===2){fb.step='list';renderFb();
    $('main').insertAdjacentHTML('afterbegin','<div class="banner alert">前天的回報已超過期限，無法送出。</div>');return;}
  fb.cust.segs.push({t:new Date().toTimeString().slice(0,5),x:fb.text});
  fb.lastText=fb.text;fb.text='';fb.step='done';renderFb();
  const c=fb.cust,d=DAYS[fb.day];
  postToChat(`客情反饋｜${c.n} ${d.d}`, flexCard('📝 客情反饋已送出',`${c.n}（${c.m}）｜${d.l} ${d.d}・第 ${c.segs.length} 段`,
    [{type:'text',text:fb.lastText,size:'sm',wrap:true,margin:'md',color:'#2b211a'}]));
}

/* ---------- 共用 ---------- */
function showMask(t,p,fn){$('m-t').textContent=t;$('m-p').textContent=p;$('m-ok').onclick=fn;$('mask').classList.add('show');}
function hideMask(){$('mask').classList.remove('show');}

boot();
</script>
</body>
