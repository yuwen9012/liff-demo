<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>回報表單（模擬）</title>
<!--
  LIFF 模擬頁（假資料，不連預約系統）
  上傳到 GitHub Pages 時改名為 index.html。
  圖文選單連結：
    業績回報 https://liff.line.me/{LIFF ID}?form=rep
    客情反饋 https://liff.line.me/{LIFF ID}?form=fb
-->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  /* 取自聚寶盆原型 v1.3 淺色主題 */
  --bg:#f6f4ef; --panel:#fffefa; --ink:#342e24; --sub:#817563; --line:#e8e1d4; --line-strong:#cfc0a5;
  --primary:#544535; --primary-soft:#f3ecdf;
  --gold:#c5a05a; --gold-dark:#947134; --gold-hi:#f1deb0; --banner-a:#f5e9cf; --banner-b:#fffdf7;
  --title-g1:#c49a46; --title-g2:#ac8030; --title-g3:#886121; --seal:#d8453b;
  --ok:#047857; --ok-soft:#ecfdf5; --warn:#c62828; --warn-soft:#fef2f2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:700 16px/1.5 -apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
input,textarea,button,select{font-weight:700}
body{min-height:100vh;display:flex;flex-direction:column}
main{flex:1;padding:0 16px 24px;max-width:560px;width:100%;margin:0 auto}
footer.bar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
footer.bar:empty{display:none}
footer.bar>div{max-width:560px;margin:0 auto}

.ic{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ic.lg{width:22px;height:22px;vertical-align:-5px}
.ic.xl{width:44px;height:44px}

/* 頁首：聚寶盆字樣＋財字印章 */
.brand{display:flex;align-items:center;gap:6px;margin:0 -16px 14px;padding:10px 16px;background:linear-gradient(110deg,var(--banner-a),var(--banner-b));border-bottom:1px solid var(--line)}
.brand .bt{font-size:19px;font-weight:900;letter-spacing:1px;background:linear-gradient(180deg,var(--title-g1),var(--title-g2) 55%,var(--title-g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .seal{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;background:var(--seal);color:#fff;font-size:12px;font-weight:900;transform:rotate(-6deg)}
.brand .me{margin-left:auto;font-size:13px;color:var(--sub);display:flex;align-items:center;gap:4px}
.brand .me .ic{width:15px;height:15px}

.topline{display:flex;justify-content:space-between;align-items:center;margin:0 2px 12px}
.topline b{font-size:18px;display:flex;align-items:center;gap:6px}
.topline span{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:4px}
.topline span .ic{width:15px;height:15px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 16px;margin-bottom:16px}
.sec h3{margin:0;padding:10px 0 2px;font-size:13px;color:var(--sub);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.sec h3 span:first-child{display:flex;align-items:center;gap:5px;color:var(--primary)}
.sec h3 .ic{width:16px;height:16px;color:var(--gold-dark)}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row label{flex:1}
.row .in{display:flex;align-items:center;gap:6px}
.row input{width:130px;text-align:right;font:inherit;font-size:17px;padding:4px 0;border:0;background:transparent;color:var(--ink)}
.row input::placeholder{color:#cbbfae}
.row input:focus{outline:none}
.row:focus-within{border-bottom-color:var(--gold)}
.row .u{color:var(--sub);font-size:14px;min-width:18px}
.sec>.hint{padding:0 0 10px}
.hint{font-size:13px;color:var(--sub)}
.hint.warn{color:var(--warn)}
.req{color:var(--warn)}
.banner{border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.banner.info{background:var(--primary-soft);color:var(--primary)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.ok .ic{width:16px;height:16px;margin-right:4px}
.banner.ok .hint{margin-top:2px}
.banner.alert{background:var(--warn-soft);color:var(--warn)}
.total{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px;color:var(--sub)}
.total span{display:flex;align-items:center;gap:5px}
.total b{font-size:21px;color:var(--gold-dark)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:8px;padding:13px;font:inherit;font-size:16px;cursor:pointer}
.btn.pri{background:var(--primary);color:#fff}
.btn.pri:disabled{background:#cbbfae}
.btn.sec2{background:var(--panel);color:var(--primary);border:1px solid var(--line-strong);margin-top:8px}

.seg{display:flex;background:var(--primary-soft);border-radius:8px;padding:2px;margin-bottom:10px}
.seg button{flex:1;min-width:0;border:0;background:none;padding:6px 0;border-radius:6px;font:inherit;font-size:14px;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--primary);box-shadow:0 1px 2px rgba(84,69,53,.15)}
.seg button small{display:block;font-size:11px;line-height:1.1;color:var(--sub)}
.searchbox{display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:8px;margin-bottom:8px;background:var(--primary-soft);color:var(--sub)}
.searchbox .ic{width:16px;height:16px}
.search{flex:1;font:inherit;padding:9px 0;border:0;background:transparent;color:var(--ink)}
.search:focus{outline:none}
#fb-list{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cust{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line)}
.cust:last-child{border-bottom:0}
.cust:active{background:var(--primary-soft)}
.cust .m{font-size:13px;color:var(--sub)}
.cust .tag{margin-left:auto;font-size:13px;color:var(--ok);white-space:nowrap;display:flex;align-items:center;gap:3px}
.cust .tag .ic{width:14px;height:14px}
.cust .tag.no{color:var(--sub)}
.cust .arr{color:var(--line-strong);font-size:20px}
.who{padding:0 2px;margin-bottom:12px;font-size:14px;color:var(--sub)}
.who b{font-size:18px;color:var(--ink)}
.prevs{font-size:14px;color:var(--sub);margin:0 2px}
.prevs summary{cursor:pointer;padding:4px 0}
.prevs[open]{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 16px;margin:0}
.back{display:inline-flex;align-items:center;color:var(--gold-dark);font-size:15px;margin:0 2px 8px}
.prev{font-size:14px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.prev:last-child{border-bottom:0}
.prev .s{color:var(--sub);font-size:12px}
textarea{width:100%;min-height:200px;font:inherit;padding:10px 0;border:0;resize:vertical;background:transparent;color:var(--ink)}
textarea::placeholder{color:#cbbfae}
textarea:focus{outline:none}
.count{text-align:right;font-size:12px;color:var(--sub);padding-bottom:8px}
.count:empty{display:none}
.count.over{color:var(--warn)}
.empty{text-align:center;color:var(--sub);padding:30px 0;font-size:14px}

.done{padding:8px 2px;text-align:center}
.done h2{margin:6px 0 2px;font-size:20px}
.done p{margin:0;color:var(--sub);font-size:14px}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 16px;margin:16px 0;font-size:15px;white-space:pre-wrap;text-align:left}
.sum .r{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.sum .r:last-child{border-bottom:0}
.sum .r b{color:var(--gold-dark)}
.sum .r.ind{padding-left:12px;color:var(--sub)}
.sum hr{display:none}

.mask{position:fixed;inset:0;background:rgba(52,46,36,.4);display:none;align-items:flex-end;z-index:20}
.mask.show{display:flex}
.sheet{background:var(--panel);width:100%;border-radius:12px 12px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h4{margin:0 0 6px;font-size:17px}
.sheet p{margin:0 0 12px;font-size:15px;color:var(--sub);white-space:pre-line}

.menu .btn{margin-bottom:10px}
.demo{margin:20px auto 0;max-width:560px;font-size:13px;color:var(--sub)}
.demo summary{cursor:pointer}
.demo label{display:flex;gap:8px;align-items:center;margin:8px 0}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-coins" viewBox="0 0 24 24"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="i-msg" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-persona" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></symbol>
  <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" style="fill:var(--gold);stroke:var(--gold-dark);stroke-width:1.5"/><circle cx="12" cy="12" r="6.6" style="fill:none;stroke:var(--gold-hi);stroke-width:1"/><rect x="9.6" y="9.6" width="4.8" height="4.8" style="fill:var(--banner-b);stroke:var(--gold-dark);stroke-width:1.2"/></symbol>
  <symbol id="i-ingot" viewBox="0 0 24 24">
    <path d="M2.5 9.5Q2 8 3.5 9Q6 11 8 10Q8 5 12 5Q16 5 16 10Q18 11 20.5 9Q22 8 21.5 10Q21 16 18 18Q15.5 20 12 20Q8.5 20 6 18Q3 16 2.5 9.5Z" style="fill:var(--gold);stroke:var(--gold-dark);stroke-width:1.3"/>
    <ellipse cx="12" cy="9" rx="4" ry="3.5" style="fill:var(--gold-hi);stroke:var(--gold-dark);stroke-width:1.2"/>
    <path d="M3 10Q6 16 12 15.5Q18 16 21 10" style="fill:none;stroke:var(--gold-dark);stroke-width:1.2"/>
  </symbol>
  <symbol id="i-hongbao" viewBox="0 0 24 24">
    <rect x="5" y="2.5" width="14" height="19" rx="2.2" style="fill:#d8453b;stroke:#9e2a22;stroke-width:1.2"/>
    <path d="M5.3 7.2Q12 12.4 18.7 7.2" style="fill:none;stroke:#9e2a22;stroke-width:1.2"/>
    <circle cx="12" cy="10.2" r="2.7" style="fill:#e9b53c;stroke:#a87812;stroke-width:1"/>
  </symbol>
</svg>
<main id="main"></main>
<footer class="bar" id="foot"></footer>

<div class="mask" id="mask"><div class="sheet">
  <h4 id="m-t"></h4><p id="m-p"></p>
  <button class="btn pri" id="m-ok">確定</button>
  <button class="btn sec2" onclick="hideMask()">返回修改</button>
</div></div>

<script>
/* ========== 設定：建好 LIFF 後把 LIFF ID 填在這裡 ========== */
const LIFF_ID = '2012761142-3REcOMxJ';
/* ======================================================= */
const PAGE_VER = '11/25 客情反饋可選 5 天';   // 每次改版更新，用來確認手機拿到的是新版

const CATS=[['rehab','復能'],['eecp','EECP'],['drip','營養點滴'],['exam','體檢商品'],['supp','保健食品']];
const RECV_SYS=6;
// 客情反饋可回報今天往回共 5 天；日期依實際今天計算
const DAY_LABELS=['今天','昨天','前天','3 天前','4 天前'];
const DAYS=DAY_LABELS.map((l,k)=>{const t=new Date();t.setDate(t.getDate()-k);
  return {k,l,d:`${t.getMonth()+1}/${t.getDate()}（${'日一二三四五六'[t.getDay()]}）`};});
const CUSTS={
  0:[{n:'王志明',m:'00000231',c:'EECP、靜脈營養點滴',segs:[{t:'10:12',x:'今天做完 EECP 後說胸悶改善很多，想了解下一期的方案。'},{t:'14:40',x:'下午點滴時太太陪同，詢問保健食品的價格。'}]},
      {n:'李美華',m:'00000877',c:'ILIB',segs:[]},
      {n:'吳佩玲',m:'00001402',c:'靜脈營養點滴',segs:[]},
      {n:'鄭雅雯',m:'00002088',c:'EECP',segs:[]},
      {n:'蔡宗宏',m:'00000556',c:'ILIB',segs:[{t:'16:05',x:'對全方位抗衰體檢有興趣，下週帶報告來討論。'}]}],
  1:[{n:'陳建宏',m:'00003310',c:'INDIBA',segs:[]},{n:'黃美玲',m:'00004021',c:'EECP',segs:[]}],
  2:[{n:'林淑惠',m:'00004533',c:'ILIB',segs:[]},{n:'張國華',m:'00002876',c:'靜脈營養點滴',segs:[{t:'15:20',x:'詢問下次點滴可否改到週末。'}]}],
  3:[{n:'劉怡君',m:'00005120',c:'INDIBA',segs:[]},{n:'周文彬',m:'00001198',c:'EECP',segs:[]},{n:'許雅婷',m:'00006047',c:'高能量雷射',segs:[]}],
  4:[{n:'陳美玲',m:'00003902',c:'EECP、靜脈營養點滴',segs:[]},{n:'黃志強',m:'00000745',c:'ILIB',segs:[]}],
};
let me='林雅婷', inLine=false, form='';
let late=false, doneBefore=false, prevRep=null, rep={};
let fb={step:'list',day:0,q:'',cust:null,text:''};

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(n||0).toLocaleString('en-US');
const num=v=>{v=String(v??'').replace(/[,\s]/g,'');if(v==='')return null;const x=Number(v);return Number.isFinite(x)&&x>=0?Math.round(x):NaN};

/* ---------- 啟動 ---------- */
function readForm(){
  const p=new URLSearchParams(location.search);
  if(p.get('form'))return p.get('form');
  const st=p.get('liff.state');               // LIFF 第一次轉址時，參數放在 liff.state
  if(st){const q=new URLSearchParams(st.split('?')[1]||'');return q.get('form')||'';}
  return '';
}
async function boot(){
  if(LIFF_ID&&window.liff){
    try{
      await liff.init({liffId:LIFF_ID});
      inLine=liff.isInClient();
      if(liff.isLoggedIn()){const p=await liff.getProfile();me=p.displayName||me;}
    }catch(e){console.warn('LIFF 初始化失敗，以一般網頁模式顯示',e);}
  }
  form=readForm();
  document.title=form==='rep'?'業績回報':form==='fb'?'客情反饋':'回報表單（模擬）';
  go(form);
}
function go(f){
  form=f;
  if(f==='rep'){initRep();}
  else if(f==='fb'){fb={step:'list',day:0,q:'',cust:null,text:'',sent:[]};renderFb();}
  else renderMenu();
}
function closeForm(){
  if(inLine){liff.closeWindow();return;}
  go('');                                      // 不在 LINE 裡時回到首頁
}
const ic=(id,c='')=>`<svg class="ic ${c}"><use href="#i-${id}"/></svg>`;
function hello(){return `<div class="brand"><span class="bt">聚寶盆</span><span class="seal">財</span><span class="me">${ic('persona')}${esc(me)}${inLine?'':'（預覽）'}</span></div>`}

function renderMenu(){
  $('main').innerHTML=`${hello()}<h2 style="margin:4px 0 14px">回報表單（模擬）</h2>
   <div class="menu"><button class="btn pri" onclick="go('rep')">${ic('hongbao','lg')}業績回報</button><button class="btn sec2" onclick="go('fb')">${ic('msg')}客情反饋</button></div>
   ${demoPanel()}`;
  $('foot').innerHTML='';
}
function demoPanel(){
  return `<details class="demo"><summary>情境模擬（展示用）</summary>
    <label><input type="checkbox" ${late?'checked':''} onchange="late=this.checked;go(form)"> 模擬 21:00 之後</label>
    <label><input type="checkbox" ${doneBefore?'checked':''} onchange="doneBefore=this.checked;if(!doneBefore)prevRep=null;go(form)"> 模擬今天已從系統回報過</label>
    <div>資料皆為假資料，送出不會寫入任何系統。</div><div>版本：${PAGE_VER}</div></details>`;
}

/* ---------- 業績回報 ---------- */
function initRep(){
  if(doneBefore&&!prevRep) prevRep={vals:{rehab:30000,eecp:null,drip:12000,exam:null,supp:null,contact:8,recv:6},at:'18:42',src:'系統'};
  rep=prevRep?{...prevRep.vals}:{rehab:null,eecp:null,drip:null,exam:null,supp:null,contact:null,recv:RECV_SYS};
  renderRep();
}
function repTotal(){return CATS.reduce((s,[k])=>s+(Number.isFinite(rep[k])?rep[k]:0),0)}
function recvHint(){const d=Number.isFinite(rep.recv)&&Math.abs(rep.recv-RECV_SYS)>=2;
  return {cls:'hint'+(d?' warn':''),txt:`系統算出 ${RECV_SYS} 位，可修改`+(d?'；與系統差 2 位以上，送出前會再確認':'')};}
function renderRep(){
  if(late){
    $('main').innerHTML=`${hello()}<div class="done"><h2>今天的回報已於 21:00 截止</h2><p>${prevRep?`今天已於 ${prevRep.at} 回報（來源：${prevRep.src}）`:'今天沒有送出回報，記為「未回報」'}</p></div>${demoPanel()}`;
    $('foot').innerHTML=`<div><button class="btn sec2" style="margin:0" onclick="closeForm()">關閉</button></div>`;return;
  }
  const head=prevRep?`<div class="banner info">今天已於 ${prevRep.at} 回報（來源：${prevRep.src}）。再次送出會覆蓋。</div>`:'';
  const rows=CATS.map(([k,l])=>`<div class="row"><label for="i-${k}">${l}</label><div class="in"><span class="u">NT$</span><input id="i-${k}" inputmode="numeric" placeholder="0" value="${Number.isFinite(rep[k])?fmt(rep[k]):''}" oninput="fmtInput(this);setRep('${k}',this.value)"></div></div>`).join('');
  const h=recvHint();
  $('main').innerHTML=`${hello()}<div class="topline"><b>${ic('hongbao','lg')}${DAYS[0].d}業績回報</b><span>${ic('clock')}21:00 截止</span></div>${head}
  <div class="sec"><h3><span>${ic('coins')}業績金額</span><span>沒有的類別不用填</span></h3>${rows}</div>
  <div class="sec"><h3><span>${ic('users')}客戶數</span></h3>
    <div class="row"><label for="i-contact">聯絡客戶 <span class="req">*</span></label><div class="in"><input id="i-contact" inputmode="numeric" placeholder="必填" value="${rep.contact??''}" oninput="setRep('contact',this.value)"><span class="u">位</span></div></div>
    <div class="row"><label for="i-recv">接待客戶 <span class="req">*</span></label><div class="in"><input id="i-recv" inputmode="numeric" value="${rep.recv??''}" oninput="setRep('recv',this.value)"><span class="u">位</span></div></div>
    <div class="${h.cls}" id="recv-hint">${h.txt}</div>
  </div>${demoPanel()}`;
  renderRepFoot();
}
function renderRepFoot(){
  const ok=Number.isFinite(rep.contact)&&Number.isFinite(rep.recv)&&CATS.every(([k])=>!Number.isNaN(rep[k]));
  $('foot').innerHTML=`<div><div class="total"><span>${ic('coin')}業績合計</span><b>NT$ ${fmt(repTotal())}</b></div><button class="btn pri" ${ok?'':'disabled'} onclick="submitRep()">送出</button></div>`;
}
/* 金額即時加千分位：只留數字，重排逗號後把游標放回原本「第幾個數字」之後 */
function fmtInput(el){
  const pos=el.selectionStart??el.value.length;
  const digitsBefore=el.value.slice(0,pos).replace(/\D/g,'').length;
  const d=el.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'');
  const f=d.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  el.value=f;
  let i=0,c=0;
  while(i<f.length&&c<digitsBefore){if(f[i]!==',')c++;i++;}
  el.setSelectionRange(i,i);
}
function setRep(k,v){rep[k]=num(v);
  if(k==='recv'){const h=recvHint();$('recv-hint').className=h.cls;$('recv-hint').textContent=h.txt;}
  renderRepFoot();}
function submitRep(){
  if(Math.abs(rep.recv-RECV_SYS)>=2){showMask('接待客戶與系統不同',`您填 ${rep.recv} 位，系統算出 ${RECV_SYS} 位。\n確定要送出嗎？`,doSubmitRep);return;}
  doSubmitRep();
}
function doSubmitRep(){
  hideMask();
  prevRep={vals:{...rep},at:new Date().toTimeString().slice(0,5),src:'LINE'};
  const lines=CATS.filter(([k])=>rep[k]).map(([k,l])=>`<div class="r ind"><span>${l}</span><span>${fmt(rep[k])}</span></div>`).join('');
  const note=rep.recv!==RECV_SYS?` <span style="font-size:12px;color:var(--sub)">（系統 ${RECV_SYS} 位）</span>`:'';
  $('main').innerHTML=`<div class="done">${ic('ingot','xl')}<h2>業績回報已送出</h2><p>${DAYS[0].d}${prevRep.at}</p>
   <div class="sum" style="white-space:normal"><div class="r"><span>今日業績</span><b>NT$ ${fmt(repTotal())}</b></div>${lines}<hr>
   <div class="r"><span>聯絡客戶</span><span>${rep.contact} 位</span></div><div class="r"><span>接待客戶</span><span>${rep.recv} 位${note}</span></div></div>
   <p style="font-size:13px">21:00 前可再次開啟「業績回報」修改。</p><div class="hint" id="chat-note"></div></div>`;
  $('foot').innerHTML=`<div><button class="btn pri" onclick="closeForm()">關閉</button></div>`;
  scrollTo(0,0);
  // 每行「項目 數值」，第一行以【回報】開頭；官方帳號的 webhook 收到後回覆回報卡
  const msg=[`【回報】${DAYS[0].d}業績回報`,`今日業績 NT$${fmt(repTotal())}`,
    ...CATS.filter(([k])=>rep[k]).map(([k,l])=>`${l} ${fmt(rep[k])}`),
    `聯絡客戶 ${rep.contact} 位`,
    `接待客戶 ${rep.recv} 位`+(rep.recv!==RECV_SYS?`（系統 ${RECV_SYS} 位）`:'')];
  postToChat(msg.join('\n'));
}

/* ---------- 送出後以使用者名義發一則「【回報】…」文字（liff.sendMessages），由官方帳號回覆回報卡 ---------- */
async function postToChat(text){
  const note=$('chat-note');
  if(!inLine){note.textContent='（瀏覽器預覽：在 LINE 開啟時，會同時傳一張回報卡到聊天室）';return;}
  note.textContent='正在傳送回報卡到聊天室…';
  let where='未知';
  try{
    where=(liff.getContext()||{}).type||'未知';           // utou＝與官方帳號的一對一聊天室
    // isApiAvailable 不接受 'sendMessages'（會丟 INVALID_ARGUMENT），改以開啟位置判斷：只有從聊天室開啟才能傳訊息
    if(!['utou','room','group','square_chat'].includes(where)){
      note.textContent=`未傳送到聊天室：請從官方帳號的聊天室開啟表單。（開啟位置：${where}）`;return;}
    // 權限是後來才加的：先查有沒有「傳送訊息」權限，沒有就請使用者補按「許可」
    let perm='';
    try{perm=(await liff.permission.query('chat_message.write')).state;}catch(e){perm='查詢失敗';}
    if(perm!=='granted'){
      note.textContent=`尚未允許「傳送訊息」權限（${perm}），即將開啟授權畫面，按「許可」後請重新送出。`;
      setTimeout(()=>{try{liff.permission.requestAll();}catch(e){note.textContent+=`（無法開啟授權畫面：${e.message||e}）`;}},1500);
      return;
    }
    await Promise.race([
      liff.sendMessages([{type:'text',text}]),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('等候 10 秒沒有回應')),10000))]);
    note.textContent='已送出，官方帳號會在聊天室回覆回報卡。';
  }catch(e){
    note.textContent=`未傳送到聊天室：${e.code?e.code+' ':''}${e.message||e}（開啟位置：${where}）`;
  }
}

/* ---------- 客情反饋 ---------- */
function renderFb(){
  const day=DAYS[fb.day];
  if(fb.step==='list'){
    const toast=fb.toast?`<div class="banner ok">${ic('check')}${esc(fb.toast)}<div class="hint" id="chat-note"></div></div>`:'';
    $('main').innerHTML=`${hello()}${toast}<div class="seg">${DAYS.map(d=>`<button class="${d.k===fb.day?'on':''}" onclick="fb.day=${d.k};fb.q='';renderFb()">${d.l}<small>${d.d}</small></button>`).join('')}</div>
      <div class="searchbox">${ic('search')}<input class="search" type="search" placeholder="搜尋姓名或病歷號" value="${esc(fb.q)}" oninput="fb.q=this.value;renderFbList()"></div>
      <div class="hint" style="margin:0 0 8px">我負責的客戶・${day.d} 有到店</div>
      <div id="fb-list"></div>${demoPanel()}`;
    renderFbList();
    // 本次開啟有回報過才出現「完成」：按下後發一張彙整卡
    $('foot').innerHTML=fb.sent.length?`<div><button class="btn pri" onclick="finishFb()">${ic('check')}完成（已回報 ${fb.sent.length} 位）</button></div>`:'';
    return;
  }
  if(fb.step==='write'){
    const c=fb.cust,n=c.segs.length+1;
    // 精簡：姓名＋一行日期課程；先前段落預設收合；輸入框不加標題
    const prev=c.segs.length?`<details class="prevs"><summary>已回報 ${c.segs.length} 段</summary>${c.segs.map((s,i)=>`<div class="prev"><div class="s">第 ${i+1} 段・${s.t}</div>${esc(s.x)}</div>`).join('')}</details>`:'';
    $('main').innerHTML=`<a class="back" onclick="fb.step='list';renderFb()">${ic('left')}客戶清單</a>
      <div class="who"><b>${c.n}</b><div>${day.d}・${c.c}</div></div>
      <div class="sec"><textarea id="fb-text" placeholder="${c.segs.length?`輸入第 ${n} 段內容`:'輸入回報內容'}" oninput="fb.text=this.value;fbCount()">${esc(fb.text)}</textarea>
      <div class="count" id="fb-count"></div></div>${prev}`;
    fbCount();return;
  }
  if(fb.step==='done'){
    const rows=fb.sent.map(x=>`<div class="r"><span>${esc(x.n)}</span><span>${x.d}・第 ${x.seg} 段</span></div>`).join('');
    $('main').innerHTML=`<div class="done">${ic('ingot','xl')}<h2>客情反饋已送出</h2><p>本次回報 ${fb.sent.length} 位客戶</p>
      <div class="sum" style="white-space:normal">${rows}</div><div class="hint" id="chat-note"></div></div>`;
    $('foot').innerHTML=`<div><button class="btn pri" onclick="closeForm()">關閉</button></div>`;
    scrollTo(0,0);
  }
}
function renderFbList(){
  const q=fb.q.trim(), all=CUSTS[fb.day];
  const list=all.filter(c=>!q||c.n.includes(q)||c.m.includes(q));
  $('fb-list').innerHTML=list.length?list.map(c=>`<div class="cust" onclick="pickCust(${all.indexOf(c)})"><div><div class="n">${c.n}</div><div class="m">${c.m}・${c.c}</div></div><span class="tag ${c.segs.length?'':'no'}">${c.segs.length?`${ic('check')}已回報 ${c.segs.length} 段`:'未回報'}</span><span class="arr">›</span></div>`).join('')
    :`<div class="empty">${q?'找不到符合的客戶':'這一天沒有您負責的到店客戶'}</div>`;
}
function pickCust(i){fb.cust=CUSTS[fb.day][i];fb.toast='';fb.step='write';renderFb();scrollTo(0,0);}
function fbCount(){
  const len=fb.text.length,over=len>500,ok=fb.text.trim()&&!over;
  const c=$('fb-count');c.textContent=len>=450?`${len} / 500`:'';c.className='count'+(over?' over':'');
  // 省步驟：不跳確認框，按鈕直接寫出客戶姓名，避免送錯人
  $('foot').innerHTML=`<div><button class="btn pri" ${ok?'':'disabled'} onclick="doSubmitFb()">送出（${esc(fb.cust.n)}）</button></div>`;
}
function confirmFb(){
  const c=fb.cust,d=DAYS[fb.day];
  showMask('確認送出？',`${c.n}｜${d.l} ${d.d}\n${c.segs.length?`補充第 ${c.segs.length+1} 段`:'新增回報'}`,doSubmitFb);
}
function doSubmitFb(){
  hideMask();
  if(late&&fb.day===DAYS.length-1){fb.step='list';renderFb();
    $('main').insertAdjacentHTML('afterbegin',`<div class="banner alert">${DAYS[fb.day].l}的回報已超過期限，無法送出。</div>`);return;}
  fb.cust.segs.push({t:new Date().toTimeString().slice(0,5),x:fb.text});
  const c=fb.cust,d=DAYS[fb.day];
  // 省步驟：送出後直接回到客戶清單，頂部提示已送出
  // 每位客戶送出時不回卡片，記下來，按「完成」時一次發彙整卡
  fb.sent.push({n:c.n,d:d.d,seg:c.segs.length});
  fb.lastText=fb.text;fb.text='';fb.q='';fb.toast=`已送出：${c.n}（第 ${c.segs.length} 段）。全部回報完請按下方「完成」`;fb.step='list';renderFb();scrollTo(0,0);
}
function finishFb(){
  fb.step='done';renderFb();
  postToChat(['【回報】客情反饋彙整',`本次回報 ${fb.sent.length} 位客戶`,...fb.sent.map(x=>`${x.n}　${x.d}第 ${x.seg} 段`)].join('\n'));
}

/* ---------- 共用 ---------- */
function showMask(t,p,fn){$('m-t').textContent=t;$('m-p').textContent=p;$('m-ok').onclick=fn;$('mask').classList.add('show');}
function hideMask(){$('mask').classList.remove('show');}

boot();
</script>
